<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Client Current Enrollments</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="householdedit.css">
    <link rel="stylesheet" href="incomeedit.css">
    <link rel="stylesheet" href="notes.css">
    <script src="userInfo.js"></script>
    <style>
        details > summary {
            cursor: pointer;
        }
    
        .household-member.no-questions {
            opacity: 0.5;
        }
    
        .household-member-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    width: 100%;
    min-width: 600px;
    max-width: 1250px;
    margin: 0 auto;
    justify-content: center;
    align-items: stretch;
}
    
        .household-member {
            display: flex;
            flex-direction: column;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            width: calc(33.333% - 20px);
            min-width: 280px;
            max-width: 400px;
            box-sizing: border-box;
            align-items: center;
        }
    
        /* Single member - wide and centered */
        .household-member-container .household-member:only-child {
            width: 1250px !important;
            min-width: 1250px !important;
            max-width: 1250px !important;
        }
    
        /* Two members */
        .household-member-container:has(.household-member:nth-child(2):last-child) .household-member {
            width: calc(50% - 20px);
            max-width: 450px;
            min-width: 450px;
        }
    
        .selection-box {
            margin-top: 10px;
            text-align: center;
            width: 100%;
        }
    
        .selection-option {
            display: inline-block;
            padding: 5px 10px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }
    
        .selection-option.selected {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
    
        .grayed-out {
            opacity: 0.5;
            pointer-events: none;
        }
    
        #save-exit, #save-continue {
            border: 1px solid #000000;
            border-radius: 5px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s, color 0.3s;
        }
    
        #save-exit:hover, #save-continue:hover {
            background-color: #0056b3;
            color: white;
        }
    </style>
</head>
<body class="narrow-body">

    <h1>Current Enrollments</h1>

    <div class="left-sidebar-container" id="leftSidebarContainer" style="display: none;">
        <div id="snap-household-container" class="left-sidebar"></div>
        <div id="liheap-household-container" class="left-sidebar"></div>
        <div id="household-members-container" class="left-sidebar"></div>
    </div>

    <div id="notes-container">
        <textarea id="note-input" placeholder="Add Note..."></textarea>
        <button id="save-note">Save Note</button>
        <div id="notes-list"></div>
    </div>
    
    <div id="householdMemberContainer" class="household-member-container"></div>

    <div class="button-container">
        <button id="save-exit">Save and Release Profile</button>
        <button id="save-continue">Save and Continue</button>
    </div>

    <!-- Scripts -->
    <script src="eligibility-utils.js"></script>
    <script src="estimations.js"></script>
    <script src="currentenrollments.js"></script>
    <script src="notes.js"></script>
    <script src="editnavigation.js"></script>
</body>
</html>
