<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Client Household</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="householdedit.css">
    <link rel="stylesheet" href="notes.css">
    <script src="userInfo.js"></script>
    <style>
        .read-only {
            pointer-events: none;
            opacity: 0.6;
        }
        body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            margin-top: 60px;
        }
        .narrow-body {
            margin-left: 385px;
            margin-right: 10px;
            max-width: calc(100% - 395px);
            margin: 0 auto;
            margin-top: 60px;
        }
    </style>
</head>
<body class="narrow-body">

    <h1>Household</h1>

    <div id="notes-container">
        <textarea id="note-input" placeholder="Add Note..."></textarea>
        <button id="save-note">Save Note</button>
        <div id="notes-list"></div>
    </div>

    <div class="selection-box">
        <label for="household-size">How many people reside in the household?</label>
        <select id="household-size" class="read-only" style="text-align: center; text-align-last: center;">
            <option value="" disabled selected>Select household size</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
        </select>
    </div>

    <div class="selection-box">
        <label id="disability-label">Is anyone in the household currently receiving disability benefits?</label>
        <div id="disability-yes" data-value="yes" class="read-only">Yes</div>
        <div id="disability-no" data-value="no" class="read-only">No</div>
    </div>

    <div class="selection-box">
        <label id="medicare-label">Is anyone in the household currently enrolled in Medicare?</label>
        <div id="medicare-yes" data-value="yes" class="read-only">Yes</div>
        <div id="medicare-no" data-value="no" class="read-only">No</div>
    </div>

    <div class="selection-box">
        <label id="medicaid-label">Is anyone in the household currently enrolled in Medicaid?</label>
        <div id="medicaid-yes" data-value="yes" class="read-only">Yes</div>
        <div id="medicaid-no" data-value="no" class="read-only">No</div>
    </div>

    <div class="selection-box">
        <label id="student-label">Is anyone in the household currently a student?</label>
        <div id="student-yes" data-value="yes" class="read-only">Yes</div>
        <div id="student-no" data-value="no" class="read-only">No</div>
    </div>

    <div class="selection-box">
        <label id="residenceStatus-label">What was your residence status during the previous year?</label>
        <div id="residenceStatus-owned" data-value="owned" class="read-only">Owned Home</div>
        <div id="residenceStatus-rented" data-value="rented" class="read-only">Rented with Formal Lease</div>
        <div id="residenceStatus-rentedowned" data-value="rentedowned" class="read-only">Owned/Rented</div>
        <div id="residenceStatus-other" data-value="other" class="read-only">Other/No Formal Agreement</div>
    </div>

    <div class="selection-box">
        <label id="snap-label">Are you currently enrolled in SNAP?</label>
        <div id="snap-yes" data-value="yes" class="read-only">Yes</div>
        <div id="snap-no" data-value="no" class="read-only">No</div>
        <div id="snap-notinterested" data-value="notinterested" class="read-only">Not Interested</div>
    </div>

    <div id="householdMemberContainer" class="household-member-container"></div>

    <script src="householdview.js"></script>
    <script src="viewnavigation.js"></script>
    <script src="notes.js"></script>
</body>
</html>
