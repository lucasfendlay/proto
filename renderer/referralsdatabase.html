<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referrals</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="notes.css">
    <link rel="stylesheet" href="householdedit.css">
    <link rel="stylesheet" href="incomeedit.css">
    <style>
        body {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body.loaded {
            visibility: visible;
            opacity: 1;
        }

        .styled-table {
            width: 100%;
            min-width: 960px;
            max-width: 960px;
            border-collapse: collapse;
        }
    
        .styled-table th, .styled-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
    
        .styled-table th {
            background-color: #f4f4f4;
        }
    
        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 20px;
        }
    
        .search-bar {
            margin-bottom: 20px;
            width: 100%;
            max-width: 960px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <button onclick="window.location.href='home.html'">Home</button>
        <button onclick="window.location.href='directory.html'">Directory</button>
    </div>

    <h1>Referrals</h1>

    <div class="left-sidebar-container" id="leftSidebarContainer" style="display: none;">
        <div id="household-members-container" class="left-sidebar"></div>
        <div id="snap-household-container" class="left-sidebar"></div>
    </div>

    <button id="addReferralBtn" style="display: none;" onclick="redirectToAddEditPage()">Add Referrals</button>

    <input type="text" id="searchInput" placeholder="Search by name, phone, or needs..." class="search-bar">
    <table id="referralTable" class="styled-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Needs</th>
                <th>Benefits</th>
                <th>Refer</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div id="notes-container" style="display: none;">
        <textarea id="note-input" placeholder="Add Note..."></textarea>
        <button id="save-note">Save Note</button>
        <div id="notes-list"></div>
    </div>

<script>
let client = {};

function getQueryParam(name) {
    return new URLSearchParams(window.location.search).get(name);
}

const CLIENT_ID = getQueryParam('id');
const HAS_CLIENT = !!CLIENT_ID;

// Only fetch client data if there's an id in the URL
function fetchClientData() {
    if (!HAS_CLIENT) {
        console.log('No client ID — showing all referrals.');
        return Promise.resolve();
    }

    return fetch(`/get-client/${CLIENT_ID}`)
        .then(response => {
            if (!response.ok) throw new Error(`Failed to fetch client data: ${response.statusText}`);
            return response.json();
        })
        .then(clientData => {
            if (clientData && clientData.county) {
                client = clientData;
            }
        })
        .catch(error => {
            console.error('Error fetching client data:', error);
        });
}

function populateReferralsTable() {
    fetch('/get-all-referrals')
        .then(response => {
            if (!response.ok) throw new Error(`Failed to fetch referrals: ${response.statusText}`);
            return response.json();
        })
        .then(referrals => {
            const tableBody = document.querySelector('#referralTable tbody');
            tableBody.innerHTML = '';

            referrals
                .filter(referral => {
                    if (!client || !client.county) return true;
                    if (!referral.county) return false;
                    if (Array.isArray(referral.county)) {
                        return referral.county.includes(client.county);
                    }
                    return referral.county === client.county;
                })
                .forEach(referral => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><a href="#" class="expand-details" onclick="toggleDetails(this)">${referral.name}</a></td>
                        <td>${referral.phone}</td>
                        <td>${Array.isArray(referral.needs) ? referral.needs.join(', ') : referral.needs}</td>
                        <td>${Array.isArray(referral.benefits) ? referral.benefits.join(', ') : referral.benefits}</td>
                        <td>
                            ${HAS_CLIENT ? `<button class="refer-btn" onclick="refer('${referral.name.replace(/'/g, "\\'")}')">Refer</button>` : ''}
                            <button class="edit-btn" onclick="redirectToEditPage('${referral.referralId}')" style="display: none;">Edit</button>
                        </td>
                    `;

                    const detailsRow = document.createElement('tr');
                    detailsRow.classList.add('details-row');
                    detailsRow.style.display = 'none';
                    detailsRow.innerHTML = `
                        <td colspan="5">
                            <p><strong>Details:</strong></p>
                            ${referral.details
                                ? referral.details.split('\n').map(line => `<p>${line}</p>`).join('')
                                : '<p>No additional details provided.</p>'}
                            <p><strong>Counties:</strong> ${Array.isArray(referral.county) ? referral.county.join(', ') : referral.county || 'N/A'}</p>
                            <p><strong>Address:</strong> ${referral.address || 'N/A'}</p>
                            <p><strong>Website:</strong> <a href="${referral.website}" target="_blank">${referral.website || 'N/A'}</a></p>
                        </td>
                    `;

                    tableBody.appendChild(row);
                    tableBody.appendChild(detailsRow);
                });

            // Show edit buttons for admins
            const activeUser = sessionStorage.getItem('loggedInUser') || '';
            if (activeUser) {
                fetch(`/get-user-role?username=${encodeURIComponent(activeUser)}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.success && data.role === 'admin') {
                            document.querySelectorAll('.edit-btn').forEach(btn => btn.style.display = 'inline-block');
                        }
                    })
                    .catch(() => {});
            }
        })
        .catch(error => {
            console.error('Error populating referrals table:', error);
        });
}

function toggleDetails(link) {
    const detailsRow = link.closest('tr').nextElementSibling;
    const isVisible = detailsRow.style.display === 'table-row';
    document.querySelectorAll('.details-row').forEach(row => row.style.display = 'none');
    detailsRow.style.display = isVisible ? 'none' : 'table-row';
}

function redirectToAddEditPage() {
    window.location.href = 'addeditreferrals.html';
}

function redirectToEditPage(referralId) {
    window.location.href = `addeditreferrals.html?referralId=${referralId}`;
}

function refer(name) {
    if (!HAS_CLIENT) return;
    if (!confirm(`Are you sure you want to refer to ${name}?`)) return;

    const activeUser = (sessionStorage.getItem('loggedInUser') || 'Unknown Agent').trim();
    const note = {
        id: crypto.randomUUID(),
        text: `Referral provided. \n ${name}.`,
        timestamp: new Date().toLocaleString(),
        username: activeUser
    };

    fetch('/add-note-to-client', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clientId: CLIENT_ID, note })
    })
    .then(response => {
        if (!response.ok) throw new Error(`Failed to save referral note: ${response.statusText}`);
        return response.json();
    })
    .then(() => {
        alert(`Referral for ${name} has been successfully logged.`);
        if (typeof renderNotes === 'function') renderNotes(CLIENT_ID);
    })
    .catch(error => {
        console.error('Error saving referral note:', error);
        alert('Failed to log the referral. Please try again.');
    });
}

async function toggleSidebarVisibility() {
    if (!HAS_CLIENT) return;

    try {
        const response = await fetch(`/get-client/${CLIENT_ID}`);
        if (!response.ok) throw new Error(`Failed to fetch client data: ${response.statusText}`);
        const clientData = await response.json();
        document.getElementById('leftSidebarContainer').style.display = clientData?.screeningInProgress ? 'block' : 'none';
    } catch (error) {
        console.error('Error toggling sidebar visibility:', error);
    }
}

document.getElementById('searchInput').addEventListener('input', function () {
    const filter = this.value.toLowerCase();
    const rows = document.querySelectorAll('#referralTable tbody tr');
    rows.forEach(row => {
        if (row.classList.contains('details-row')) {
            row.style.display = 'none';
            return;
        }
        const rowText = Array.from(row.querySelectorAll('td')).map(cell => cell.textContent.toLowerCase()).join(' ');
        row.style.display = rowText.includes(filter) ? '' : 'none';
    });
});

// Check admin for add button
function checkAdminAddButton() {
    const activeUser = sessionStorage.getItem('loggedInUser') || '';
    const addReferralBtn = document.getElementById('addReferralBtn');
    if (!activeUser) { addReferralBtn.style.display = 'none'; return; }

    fetch(`/get-user-role?username=${encodeURIComponent(activeUser)}`)
        .then(r => r.json())
        .then(data => {
            addReferralBtn.style.display = (data.success && data.role === 'admin') ? 'inline-block' : 'none';
        })
        .catch(() => { addReferralBtn.style.display = 'none'; });
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', async () => {
    try {
        checkAdminAddButton();
        await fetchClientData();
        populateReferralsTable();

        if (HAS_CLIENT) {
            await toggleSidebarVisibility();
            document.getElementById('notes-container').style.display = '';
        }
    } catch (e) {
        console.error('Init error:', e);
    } finally {
        document.body.classList.add('loaded');
    }
});
</script>

<script>
    function populateActiveUser() {
        const activeUser = sessionStorage.getItem('loggedInUser');
        if (!activeUser) return;

        fetch(`/get-user-role?username=${encodeURIComponent(activeUser)}`)
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(data => {
                if (data.success) {
                    const userInfoDiv = document.createElement('div');
                    userInfoDiv.style.cssText = 'position:absolute;top:10px;right:10px;background-color:#007bff;color:white;padding:10px;border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,0.2);';
                    userInfoDiv.textContent = `User: ${activeUser.trim()} | Role: ${data.role}`;
                    document.body.appendChild(userInfoDiv);
                }
            })
            .catch(e => console.error('Error fetching user role:', e));
    }
    populateActiveUser();
</script>

</body>
</html>
