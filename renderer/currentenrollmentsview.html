<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Client Current Enrollments</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="householdedit.css">
    <link rel="stylesheet" href="notes.css">
    <script src="userInfo.js"></script>
    <style>
        .narrow-body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            margin-top: 60px;
        }

        .household-member-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            align-items: center;
        }

        .household-member {
            display: flex;
            flex-direction: column;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            width: 80%;
            align-items: center;
        }

        .household-member.no-questions {
            opacity: 0.5;
        }

        .selection-box {
            margin-top: 10px;
            text-align: center;
            pointer-events: none;
            opacity: 0.8;
        }

        .selection-option {
            display: inline-block;
            padding: 5px 10px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: default;
        }

        .selection-option.selected {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
    </style>
</head>
<body class="narrow-body">
    <h1>Current Enrollments</h1>

    <div id="notes-container">
        <textarea id="note-input" placeholder="Add Note..."></textarea>
        <button id="save-note">Save Note</button>
        <div id="notes-list"></div>
    </div>
    
    <div id="householdMemberContainer" class="household-member-container"></div>

    <script src="currentenrollmentsview.js"></script>
    <script src="notes.js"></script>
    <script src="viewnavigation.js"></script>
</body>
</html>
