<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Logging</title>
    <link rel="stylesheet" href="styles.css">
    <script src="userInfo.js"></script>
    <style>
        body {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body.loaded {
            visibility: visible;
            opacity: 1;
        }

        .error { border: 2px solid red; background-color: #ffe6e6; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Log New Call</h1>
    <form id="callLogForm">
        <label for="Agent">Contact Center Specialist:</label>
        <input type="text" id="Agent" name="Agent" readonly><br><br>

        <label for="servicingCenter">Service Center:</label>
        <select id="servicingCenter" name="servicingCenter" required>
            <option value="" disabled selected>Select Servicing Center</option>
            <option value="PACE Application Center">PACE Application Center (Outreach)</option>
            <option value="PACE Application Center Referrals">PACE Application Center (Referrals)</option>
            <option value="Benephilly">Benephilly</option>
            <option value="PA MEDI">PA MEDI</option>
            <option value="PACE HSX Historical">PACE HSX Historical</option>
            <option value="PACE HSX PENN">PACE HSX PENN</option>
            <option value="PACE HSX Temple">PACE HSX Temple</option>
            <option value="Tom Referrals">Tom Referrals</option>
            <option value="PACE Elevated">PACE Elevated</option>
            <option value="GOV SNAP">GOV SNAP</option>
        </select><br><br>

        <label for="callerSelection">Select Contact:</label>
        <select id="callerSelection" name="callerSelection" required>
            <option value="">Select Contact</option>
        </select><br><br>

        <label for="callerFirstName" class="hidden">Contact First Name:</label>
        <input type="text" id="callerFirstName" name="callerFirstName" class="hidden"><br><br>
        <label for="callerLastName" class="hidden">Contact Last Name:</label>
        <input type="text" id="callerLastName" name="callerLastName" class="hidden"><br><br>
        <label for="callerPhoneNumber" class="hidden">Contact Phone Number:</label>
        <input type="text" id="callerPhoneNumber" name="callerPhoneNumber" class="hidden"><br><br>

        <label for="callDirection">Call Direction:</label>
        <select id="callDirection" name="callDirection" required>
            <option value="" disabled selected>Select Call Direction</option>
            <option value="Inbound">Inbound</option>
            <option value="Outbound">Outbound</option>
        </select><br><br>

        <label for="reasonForCall">Reason for Call:</label>
        <select id="reasonForCall" name="reasonForCall" required>
            <option value="" disabled selected>Select Reason for Call</option>
            <option value="To Apply Myself for Public Benefits">To Apply Myself for Public Benefits</option>
            <option value="To Apply Someone Else for Public Benefits">To Apply Someone Else for Public Benefits</option>
            <option value="To Recertify SNAP and/or Medical Assistance">To Recertify SNAP and/or Medical Assistance</option>
            <option value="Post-Submission Questions">Post-Submission Questions</option>
            <option value="Questions about an Existing Case">Questions about an Existing Case</option>
            <option value="Other">Another Reason</option>
        </select><br><br>

        <div id="referralSourceContainer">
            <label for="referralSource">Referral Source:</label>
            <select id="referralSource" name="referralSource" onchange="handleReferralSourceChange()">
                <option value="" disabled selected>Select Referral Source</option>
                <option value="Outreach">Outreach</option>
                <option value="Referral from a Government Agency">Referral from a Government Agency</option>
                <option value="Referral from a CBO">Referral from a Community-Based Organization</option>
                <option value="Community Referral">Community Referral</option>
                <option value="Internet Search">Internet Search</option>
            </select><br><br>
        </div>

        <div id="specificReferralContainer" style="display: none;">
            <label for="specificReferral">Specifically, which?</label>
            <input type="text" id="specificReferral" name="specificReferral" placeholder="Enter details">
        </div>

        <button type="button" onclick="goBackToProfile()">Back to Profile</button>
        <button type="button" onclick="logNewCall()">Log New Call</button>
    </form>

    <script>
    // ===== GLOBALS =====
    const CLIENT_ID = new URLSearchParams(window.location.search).get('id');
    const ACTIVE_USER = sessionStorage.getItem('loggedInUser');
    let clientCache = null;
    let hasExistingCallLogs = false;

    // ===== UTILITIES =====
    function getEl(id) { return document.getElementById(id); }
    function getVal(id) { return getEl(id)?.value || ''; }

    function formatPhoneNumber(phone) {
        if (!phone) return '';
        const cleaned = phone.replace(/\D/g, '');
        const match = cleaned.match(/^(\d{3})(\d{3})(\d{4})$/);
        return match ? `(${match[1]})-${match[2]}-${match[3]}` : phone;
    }

    function isFieldVisible(fieldId) {
        const el = getEl(fieldId);
        if (!el) return false;
        if (el.classList.contains('hidden')) return false;
        const container = el.closest('[id$="Container"]');
        if (container && container.style.display === 'none') return false;
        return el.style.display !== 'none';
    }

    function goBackToProfile() {
        window.location.href = `profileview.html?id=${CLIENT_ID}`;
    }

    // ===== SINGLE FETCH =====
    async function fetchClient() {
        const response = await fetch(`/get-client/${CLIENT_ID}`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' },
        });
        if (!response.ok) throw new Error(`Failed to fetch client: ${response.statusText}`);
        return response.json();
    }

    // ===== POPULATE CALLER SELECTION =====
    function populateCallerSelection(client) {
        const callerSelection = getEl('callerSelection');
        callerSelection.innerHTML = '<option value="">Select Contact</option>';

        const uniqueContacts = new Map();

        if (client && Array.isArray(client.Contacts) && client.Contacts.length > 0) {
            client.Contacts.forEach(contact => {
                const contactKey = `${contact.firstName} ${contact.lastName} ${contact.phoneNumber}`.trim();
                if (contact.firstName && contact.lastName && contact.phoneNumber && !uniqueContacts.has(contactKey)) {
                    uniqueContacts.set(contactKey, contact);
                    const option = document.createElement('option');
                    option.value = JSON.stringify({
                        callerFirstName: contact.firstName,
                        callerLastName: contact.lastName,
                        callerPhoneNumber: contact.phoneNumber,
                        contactId: contact.contactId,
                    });
                    option.textContent = `${contact.firstName} ${contact.lastName} - ${formatPhoneNumber(contact.phoneNumber)}`;
                    callerSelection.appendChild(option);
                }
            });
        } else if (client && client.firstName && client.lastName) {
            const option = document.createElement('option');
            option.value = JSON.stringify({
                callerFirstName: client.firstName,
                callerLastName: client.lastName,
                callerPhoneNumber: client.phoneNumber,
            });
            option.textContent = `${client.firstName} ${client.lastName} - ${formatPhoneNumber(client.phoneNumber)}`;
            callerSelection.appendChild(option);
        }

        const addNewOption = document.createElement('option');
        addNewOption.value = 'new';
        addNewOption.textContent = 'Add New Contact';
        callerSelection.appendChild(addNewOption);
    }

    // ===== CALLER SELECTION CHANGE =====
    function handleCallerSelectionChange() {
        const selectedValue = getVal('callerSelection');
        const firstNameEl = getEl('callerFirstName');
        const lastNameEl = getEl('callerLastName');
        const phoneEl = getEl('callerPhoneNumber');
        const firstNameLabel = document.querySelector('label[for="callerFirstName"]');
        const lastNameLabel = document.querySelector('label[for="callerLastName"]');
        const phoneLabel = document.querySelector('label[for="callerPhoneNumber"]');

        if (selectedValue === 'new') {
            [firstNameEl, lastNameEl, phoneEl, firstNameLabel, lastNameLabel, phoneLabel]
                .forEach(el => el.classList.remove('hidden'));
            firstNameEl.value = '';
            lastNameEl.value = '';
            phoneEl.value = '';
        } else if (selectedValue) {
            const contactDetails = JSON.parse(selectedValue);
            firstNameEl.value = contactDetails.callerFirstName;
            lastNameEl.value = contactDetails.callerLastName;

            if (contactDetails.callerPhoneNumber) {
                [firstNameEl, lastNameEl, phoneEl, firstNameLabel, lastNameLabel, phoneLabel]
                    .forEach(el => el.classList.add('hidden'));
                phoneEl.value = contactDetails.callerPhoneNumber;
            } else {
                [firstNameEl, lastNameEl, firstNameLabel, lastNameLabel]
                    .forEach(el => el.classList.add('hidden'));
                [phoneEl, phoneLabel].forEach(el => el.classList.remove('hidden'));
                phoneEl.value = '';
            }
        }
    }

    // ===== UI TOGGLES =====
    function toggleOutboundFields() {
        const isOutbound = getVal('callDirection') === 'Outbound';

        const reasonLabel = document.querySelector('label[for="reasonForCall"]');
        const reasonSelect = getEl('reasonForCall');
        const referralContainer = getEl('referralSourceContainer');

        reasonLabel.style.display = isOutbound ? 'none' : 'inline-block';
        reasonSelect.style.display = isOutbound ? 'none' : 'inline-block';

        // Only toggle referral container if call logs haven't already hidden it permanently
        if (!hasExistingCallLogs) {
            referralContainer.style.display = isOutbound ? 'none' : 'block';
        }

        if (isOutbound) {
            reasonSelect.value = '';
            if (!hasExistingCallLogs) {
                getEl('referralSource').value = '';
                getEl('specificReferral').value = '';
                getEl('specificReferralContainer').style.display = 'none';
            }
        }
    }

    function handleReferralSourceChange() {
        const referralSource = getVal('referralSource');
        const needsSpecific = ['Referral from a Government Agency', 'Referral from a CBO', 'Community Referral'].includes(referralSource);
        getEl('specificReferralContainer').style.display = needsSpecific ? 'block' : 'none';
    }

    // ===== VALIDATION =====
    function validateForm() {
        const isOutbound = getVal('callDirection') === 'Outbound';
        const selectedContact = getVal('callerSelection');

        const fieldsToValidate = ['servicingCenter', 'callerSelection', 'callerPhoneNumber', 'callDirection'];

        // Only validate name fields if "Add New Contact" selected
        if (selectedContact === 'new') {
            fieldsToValidate.push('callerFirstName', 'callerLastName');
        }

        if (!isOutbound) {
            fieldsToValidate.push('reasonForCall');
            if (isFieldVisible('referralSource')) fieldsToValidate.push('referralSource');
            if (isFieldVisible('specificReferral')) fieldsToValidate.push('specificReferral');
        }

        // Clear previous errors
        document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));

        const invalidFields = [];
        for (const fieldId of fieldsToValidate) {
            const el = getEl(fieldId);
            if (!el) continue;

            // Skip hidden fields (except callerPhoneNumber which may be populated from selection)
            if (el.classList.contains('hidden') && fieldId !== 'callerPhoneNumber') continue;

            if (!el.value.trim()) {
                invalidFields.push(el);
            }
        }

        // Phone validation
        const phone = getVal('callerPhoneNumber').replace(/\D/g, '');
        if (!/^\d{10}$/.test(phone)) {
            const phoneEl = getEl('callerPhoneNumber');
            if (!invalidFields.includes(phoneEl)) invalidFields.push(phoneEl);
        }

        if (invalidFields.length > 0) {
            invalidFields.forEach(field => {
                if (!field) return;
                field.classList.add('error');
                const handler = function () {
                    if (field.value.trim()) {
                        field.classList.remove('error');
                        field.removeEventListener('input', handler);
                        field.removeEventListener('change', handler);
                    }
                };
                field.addEventListener('input', handler);
                field.addEventListener('change', handler);
            });

            const phoneEl = getEl('callerPhoneNumber');
            const hasPhoneError = invalidFields.includes(phoneEl);
            if (hasPhoneError && phone.length > 0) {
                alert('Phone number must be exactly 10 digits.');
            } else if (hasPhoneError && phone.length === 0) {
                alert('Please fill out all required fields, including phone number.');
            } else {
                alert('Please fill out all required fields.');
            }
            return null;
        }

        // Build caller info
        let callerFirstName, callerLastName, callerPhoneNumber, contactId;

        if (selectedContact === 'new') {
            callerFirstName = getVal('callerFirstName').trim();
            callerLastName = getVal('callerLastName').trim();
            callerPhoneNumber = phone;
            contactId = `contact-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
        } else {
            const contactDetails = JSON.parse(selectedContact);
            callerFirstName = contactDetails.callerFirstName;
            callerLastName = contactDetails.callerLastName;
            callerPhoneNumber = contactDetails.callerPhoneNumber || phone;
            contactId = contactDetails.contactId || `contact-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
        }

        return {
            callLog: {
                agent: getVal('Agent'),
                servicingCenter: getVal('servicingCenter'),
                callerFirstName,
                callerLastName,
                callerPhoneNumber,
                callDirection: getVal('callDirection'),
                reasonForCall: getVal('reasonForCall'),
                referralSource: getVal('referralSource'),
                specificReferral: isFieldVisible('specificReferral') ? getVal('specificReferral') : null,
                timestamp: new Date().toLocaleString(),
            },
            contactData: {
                firstName: callerFirstName,
                lastName: callerLastName,
                phoneNumber: callerPhoneNumber,
                contactId,
            },
            isNewContact: selectedContact === 'new',
        };
    }

    // ===== MAIN ACTION =====
    async function logNewCall() {
        const validated = validateForm();
        if (!validated) return;

        const { callLog, contactData, isNewContact } = validated;

        try {
            const requests = [];

            // 1. Log the call
            requests.push(fetch('/log-call', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clientId: CLIENT_ID, callLog }),
            }));

            // 2. Save contact — only if new and not a duplicate
            if (isNewContact) {
                const isDuplicate = clientCache?.Contacts?.some(c =>
                    c.firstName === contactData.firstName &&
                    c.lastName === contactData.lastName &&
                    c.phoneNumber === contactData.phoneNumber
                ) || false;

                if (!isDuplicate) {
                    requests.push(fetch('/add-to-contacts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ clientId: CLIENT_ID, contact: contactData }),
                    }));
                }
            }

            // 3. Update client data — only if caller is applying for themselves or outbound
            const reason = callLog.reasonForCall;
            const isOutbound = callLog.callDirection === 'Outbound';
            const isApplyingSomeoneElse = reason === 'To Apply Someone Else for Public Benefits';

            if (!isApplyingSomeoneElse || isOutbound) {
                requests.push(fetch('/update-client', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        clientId: CLIENT_ID,
                        clientData: { phoneNumber: callLog.callerPhoneNumber },
                    }),
                }));
            }

            // 4. Add call note
            requests.push(fetch('/add-note-to-client', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    clientId: CLIENT_ID,
                    note: {
                        text: `<strong>${callLog.callDirection} call logged.</strong> <br><br> Service Center: <br><br> ${callLog.servicingCenter}`,
                        timestamp: callLog.timestamp,
                        username: ACTIVE_USER,
                    },
                }),
            }));

            // 5. Check out profile
            requests.push(fetch('/update-client', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    clientId: CLIENT_ID,
                    clientData: {
                        checkedOut: [{
                            status: true,
                            timestamp: new Date().toISOString(),
                            user: ACTIVE_USER ? ACTIVE_USER.trim() : 'Unknown User',
                        }],
                    },
                }),
            }));

            // Fire all requests in parallel
            const results = await Promise.all(requests);

            // Check the call log response (first request)
            const logResult = await results[0].json();
            if (!results[0].ok || !logResult.success) {
                alert(logResult.message || 'Failed to log call.');
                return;
            }

            window.location.href = `profileedit.html?id=${CLIENT_ID}`;
        } catch (error) {
            console.error('Error logging call:', error);
            alert('An error occurred while logging the call.');
        }
    }

    // ===== INITIALIZATION =====
    async function initPage() {
        try {
            clientCache = await fetchClient();

            // Populate agent
            if (ACTIVE_USER) getEl('Agent').value = ACTIVE_USER;

            // Populate caller dropdown from cached data
            populateCallerSelection(clientCache);

            // Check if existing call logs → permanently hide referral source
            hasExistingCallLogs = Array.isArray(clientCache.callLogs) && clientCache.callLogs.length > 0;
            if (hasExistingCallLogs) {
                getEl('referralSourceContainer').style.display = 'none';
            }

            // Wire up event listeners
            getEl('callerSelection').addEventListener('change', handleCallerSelectionChange);
            getEl('callDirection').addEventListener('change', toggleOutboundFields);
            toggleOutboundFields();
            document.body.classList.add('loaded');
        } catch (error) {
            console.error('Error initializing page:', error);
            alert('Failed to load client data. Please try again.');
            document.body.classList.add('loaded');
        }
    }

    document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
