    <script>
    // ── Initialization ──
    document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.remove('hidden');
    });

    // ── Utility ──
    function getQueryParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }

    async function confirmSaveAndRelease() {
        if (!confirm("Are you sure you want to save and release this profile?")) return;

        const activeUser = sessionStorage.getItem('loggedInUser');
        if (!activeUser) {
            console.error("No active user found in sessionStorage.");
            return;
        }

        const clientId = getQueryParam('id');

        try {
            await fetch('/update-client', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    clientId: clientId,
                    clientData: {
                        checkedOut: [{
                            status: false,
                            timestamp: null,
                            user: null,
                        }],
                    },
                }),
            });

            await fetch('/add-note-to-client', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    clientId: clientId,
                    note: {
                        text: "Profile released.",
                        timestamp: new Date().toLocaleString(),
                        username: activeUser,
                    },
                }),
            });

            window.location.href = `profileview.html?id=${clientId}`;
        } catch (error) {
            console.error("Error during save and release:", error);
        }
    }

    // ── Sidebar toggle between Screening and Contacts ──
    async function showSidebarView(view) {
        const screeningList = document.getElementById('household-members-container');
        const contactsList = document.getElementById('contacts-list');
        const screeningBtn = document.getElementById('toggle-screening-btn');
        const contactsBtn = document.getElementById('toggle-contacts-btn');
        const screeningHeaderActions = document.getElementById('screening-header-actions');
        const contactsHeaderActions = document.getElementById('contacts-header-actions');
        const addContactBtn = document.getElementById('add-contact-button');
        const snapContainer = document.getElementById('snap-household-container');
        const liheapContainer = document.getElementById('liheap-household-container');
        const stopScreeningContainer = document.getElementById('stop-screening-container');

        // Hide everything first
        screeningList.style.display = 'none';
        contactsList.style.display = 'none';
        screeningHeaderActions.style.display = 'none';
        contactsHeaderActions.style.display = 'none';
        addContactBtn.style.display = 'none';
        if (snapContainer) snapContainer.style.display = 'none';
        if (liheapContainer) liheapContainer.style.display = 'none';
        if (stopScreeningContainer) stopScreeningContainer.style.display = 'none';

        if (view === 'screening') {
            screeningBtn.classList.add('active');
            contactsBtn.classList.remove('active');

            // Check if screening is actually in progress before showing benefit cards
            const clientId = getQueryParam('id');
            let screeningActive = false;
            try {
                const res = await fetch(`/get-client/${clientId}`);
                if (res.ok) {
                    const client = await res.json();
                    screeningActive = client?.screeningInProgress === true;
                }
            } catch (e) {
                console.error('Error checking screening status:', e);
            }

            requestAnimationFrame(() => {
                screeningList.style.display = screeningActive ? '' : 'none';
                screeningHeaderActions.style.display = 'flex';
                if (snapContainer) snapContainer.style.display = screeningActive ? '' : 'none';
                if (liheapContainer) liheapContainer.style.display = screeningActive ? '' : 'none';
                if (stopScreeningContainer) stopScreeningContainer.style.display = '';
            });
        } else if (view === 'contacts') {
            screeningBtn.classList.remove('active');
            contactsBtn.classList.add('active');

            // Render contacts first, then reveal once ready
            renderContacts().then(() => {
                requestAnimationFrame(() => {
                    contactsList.style.display = 'flex';
                    addContactBtn.style.display = '';
                });
            }).catch(() => {
                // Still show the tab even if rendering fails
                requestAnimationFrame(() => {
                    contactsList.style.display = 'flex';
                    addContactBtn.style.display = '';
                });
            });
        }
    }

    // ── Contacts CRUD ──
    let editingContactIndex = null;
    let cachedClient = null;

    function formatPhoneNumber(phone) {
        if (!phone) return '';
        const cleaned = String(phone).trim().replace(/\D/g, '');
        const digits = cleaned.length === 11 && cleaned.startsWith('1') ? cleaned.substring(1) : cleaned;
        if (digits.length === 10) {
            return `(${digits.substring(0, 3)})-${digits.substring(3, 6)}-${digits.substring(6)}`;
        }
        return String(phone).trim();
    }

    async function fetchClientData() {
        const clientId = getQueryParam('id');
        const response = await fetch(`/get-client/${clientId}`);
        if (!response.ok) throw new Error(response.statusText);
        cachedClient = await response.json();
        return cachedClient;
    }

    function openContactModal(index = null) {
        editingContactIndex = index;
        const modal = document.getElementById('contactModal');
        const title = document.getElementById('contact-modal-title');
        const buttonContainer = modal.querySelector('.button-container');
        const form = document.getElementById('contactForm');

        // Remove any previously injected "Add to Household" button
        const existingAddBtn = document.getElementById('addContactToHouseholdBtn');
        if (existingAddBtn) existingAddBtn.remove();

        // Rebuild buttons
        buttonContainer.innerHTML = `
            <button type="button" onclick="closeContactModal()">Cancel</button>
            <button type="button" onclick="saveContact()">Save</button>
        `;

        if (index !== null && cachedClient) {
            title.textContent = 'Edit Contact';
            const contact = (cachedClient.Contacts || [])[index];
            if (contact) {
                document.getElementById('contactFirstName').value = contact.firstName || '';
                document.getElementById('contactLastName').value = contact.lastName || '';
                document.getElementById('contactPhoneNumber').value = formatPhoneNumber(contact.phoneNumber) || '';
                document.getElementById('authorizedRepresentative').value = contact.authorizedRepresentative || 'N/A';

                // Show "Add to Household" button only if this contact is not already a household member
                const members = cachedClient.householdMembers || [];
                const alreadyMember = members.some(m =>
                    m && (m.householdMemberId === contact.contactId)
                );

                if (!alreadyMember && contact.contactId) {
                    const addToHouseholdBtn = document.createElement('button');
                    addToHouseholdBtn.id = 'addContactToHouseholdBtn';
                    addToHouseholdBtn.type = 'button';
                    addToHouseholdBtn.textContent = 'Add to Household';
                    addToHouseholdBtn.style.cssText =
                        'display:block;width:100%;margin-bottom:12px;padding:10px;' +
                        'background-color:#007bff;color:#fff;border:1px solid #003f7f;' +
                        'border-radius:5px;cursor:pointer;font-weight:600;';
                    addToHouseholdBtn.onmouseover = () => addToHouseholdBtn.style.backgroundColor = '#0056b3';
                    addToHouseholdBtn.onmouseout = () => addToHouseholdBtn.style.backgroundColor = '#007bff';
                    addToHouseholdBtn.onclick = () => addContactToHousehold(index);

                    // Insert above the First Name label
                    const firstNameLabel = form.querySelector('label[for="contactFirstName"]');
                    if (firstNameLabel) {
                        form.insertBefore(addToHouseholdBtn, firstNameLabel);
                    }
                }
            }

            const deleteButton = document.createElement('button');
            deleteButton.textContent = 'Delete';
            deleteButton.type = 'button';
            deleteButton.style.cssText = 'background-color:red;color:white;';
            deleteButton.onmouseover = () => deleteButton.style.backgroundColor = 'darkred';
            deleteButton.onmouseout = () => deleteButton.style.backgroundColor = 'red';
            deleteButton.onclick = () => deleteContact(index);
            buttonContainer.prepend(deleteButton);
        } else {
            title.textContent = 'Add Contact';
            document.getElementById('contactForm').reset();
        }

        modal.classList.add('show');
    }

    // ── Add a contact as a household member (sharing IDs so name edits stay in sync) ──
    async function addContactToHousehold(index) {
        const clientId = getQueryParam('id');
        if (!clientId) return;

        try {
            const client = await fetchClientData();
            const contact = (client.Contacts || [])[index];
            if (!contact) {
                alert('Contact not found.');
                return;
            }

            if (!client.householdMembers) client.householdMembers = [];

            // Guard against duplicates
            const alreadyMember = client.householdMembers.some(m =>
                m && m.householdMemberId === contact.contactId
            );
            if (alreadyMember) {
                alert('This contact is already a household member.');
                return;
            }

            if (!confirm(`Add ${(contact.firstName || '').toUpperCase()} ${(contact.lastName || '').toUpperCase()} to the household?`)) {
                return;
            }

            // Build new household member with N/A for fields not captured by the contact modal.
            // householdMemberId is intentionally set to the contactId so name edits stay in sync.
            const newMember = {
                householdMemberId: contact.contactId,
                prefix: '',
                firstName: contact.firstName || '',
                middleInitial: '',
                lastName: contact.lastName || '',
                suffix: '',
                dob: 'N/A',
                legalSex: '',
                deceased: '',
                dateOfDeath: '',
                maritalStatus: '',
                previousMaritalStatus: '',
                socialSecurityNumber: '',
                disability: '',
                medicare: '',
                medicaid: '',
                citizen: '',
                nonCitizenStatus: '',
                student: '',
                studentStatus: '',
                meals: ''
            };

            client.householdMembers.push(newMember);

            const response = await fetch('/update-client', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    clientId,
                    clientData: { householdMembers: client.householdMembers }
                })
            });

            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.success === false) {
                console.error('Failed to add contact to household:', result.message);
                alert(`Error: ${result.message || 'Could not add contact to household.'}`);
                return;
            }

            cachedClient = client;
            closeContactModal();

            // Refresh sidebar/household UI if available
            if (typeof loadSavedData === 'function') {
                try { await loadSavedData(); } catch (e) { /* ignore */ }
            }
        } catch (error) {
            console.error('Error adding contact to household:', error);
            alert('An error occurred while adding the contact to the household.');
        }
    }

    function closeContactModal() {
        const modal = document.getElementById('contactModal');
        modal.classList.remove('show');
        editingContactIndex = null;
        document.getElementById('contactForm').reset();
    }

    async function saveContact() {
        const clientId = getQueryParam('id');
        const firstName = document.getElementById('contactFirstName').value.trim();
        const lastName = document.getElementById('contactLastName').value.trim();
        const phoneNumber = document.getElementById('contactPhoneNumber').value.trim();
        const authorizedRepresentative = document.getElementById('authorizedRepresentative').value;
        const phoneNumberInput = document.getElementById('contactPhoneNumber');
        phoneNumberInput.classList.remove('error');

        if (!firstName || !lastName || !phoneNumber) {
            alert('Please fill in all required fields.');
            return;
        }

        const cleanedPhone = phoneNumber.replace(/[\(\)\-\s]/g, '');
        if (!/^\d{10}$/.test(cleanedPhone)) {
            alert('Please enter a valid phone number (10 digits or (xxx)-xxx-xxxx format).');
            phoneNumberInput.classList.add('error');
            return;
        }

        try {
            const client = await fetchClientData();
            if (!client.Contacts) client.Contacts = [];

            const newContact = {
                firstName,
                lastName,
                phoneNumber: cleanedPhone,
                authorizedRepresentative,
                contactId: editingContactIndex !== null
                    ? client.Contacts[editingContactIndex]?.contactId
                    : `contact-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
            };

            const isDuplicate = client.Contacts.some((c, i) =>
                i !== editingContactIndex &&
                (c.firstName || '').toUpperCase() === newContact.firstName.toUpperCase() &&
                (c.lastName || '').toUpperCase() === newContact.lastName.toUpperCase() &&
                (c.phoneNumber || '').replace(/\D/g, '') === newContact.phoneNumber
            );
            if (isDuplicate) {
                alert('This contact already exists.');
                return;
            }

            const requestBody = { clientId, contact: newContact };

            if (editingContactIndex !== null) {
                requestBody.index = editingContactIndex;
                client.Contacts[editingContactIndex] = newContact;
            } else {
                client.Contacts.push(newContact);
            }

            const response = await fetch('/add-to-contacts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody),
            });

            const result = await response.json();
            if (!response.ok || !result.success) {
                console.error('Failed to save contact:', result.message);
                alert(`Error: ${result.message}`);
                return;
            }

            cachedClient = client;
            closeContactModal();
            renderContacts();
        } catch (error) {
            console.error('Error saving contact:', error);
            alert('An error occurred while saving the contact.');
        }
    }

    async function deleteContact(index) {
        if (!confirm('Are you sure you want to delete this contact?')) return;
        const clientId = getQueryParam('id');

        try {
            const client = await fetchClientData();
            const deletedContact = (client.Contacts || []).splice(index, 1)[0];

            const response = await fetch('/add-to-contacts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    clientId,
                    contact: deletedContact,
                    index,
                    delete: true,
                }),
            });

            const result = await response.json();
            if (!result.success) {
                console.error('Failed to delete contact:', result.message);
            }

            cachedClient = client;
            renderContacts();
            closeContactModal();
        } catch (error) {
            console.error('Error deleting contact:', error);
        }
    }

    async function renderContacts() {
        const container = document.getElementById('contacts-list');
        container.innerHTML = '';

        try {
            const client = await fetchClientData();
            const contacts = client.Contacts || [];

            if (contacts.length === 0) {
                container.innerHTML = '<p>No contacts available.</p>';
                return;
            }

            const fragment = document.createDocumentFragment();
            contacts.forEach((contact, index) => {
                const div = document.createElement('div');
                div.classList.add('contact-card');
                div.innerHTML = `
                    <p><strong>Name:</strong><br> ${(contact.firstName || 'N/A').toUpperCase()} ${(contact.lastName || 'N/A').toUpperCase()}</p>
                    <p><strong>Phone:</strong><br> ${formatPhoneNumber(contact.phoneNumber) || 'N/A'}</p>
                    <p><strong>Authorized Representative:</strong><br> ${(contact.authorizedRepresentative || 'N/A').toUpperCase()}</p>
                    <button onclick="openContactModal(${index})">Edit Contact</button>
                `;
                fragment.appendChild(div);
            });
            container.appendChild(fragment);
        } catch (error) {
            console.error('Error rendering contacts:', error);
            container.innerHTML = '<p style="color:red;">Error loading contacts.</p>';
        }
    }

    // Close contact modal when clicking outside
    document.getElementById('contactModal').addEventListener('click', function(event) {
        if (event.target === this) {
            closeContactModal();
        }
    });
    </script>
</body>
