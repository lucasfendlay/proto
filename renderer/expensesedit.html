<!-- JavaScript for selection functionality -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const utilityExpenseList = document.getElementById('utility-expense-list');
        const closeUtilityModal = document.getElementById('close-utility-modal');
        const utilityModal = document.getElementById('utility-modal');

        // Toggle selection on click
        utilityExpenseList.addEventListener('click', (event) => {
            if (event.target.classList.contains('selection-box')) {
                event.target.classList.toggle('selected');
            }
        });

        // Close modal on clicking the close button
        closeUtilityModal.addEventListener('click', () => {
            utilityModal.classList.add('hidden');
        });
    });
</script>

function getQueryParameter(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
}

function GoToEstimationsStep() {
    const clientId = getQueryParameter('id');
    if (clientId) {
        window.location.href = `estimationsstep.html?id=${clientId}`;
    } else {
        console.error('Client ID not found in query parameters.');
    }
}

async function goToExpenseView() {
    const clientId = getQueryParameter('id'); // Reuse the getQueryParameter function
    if (!clientId) {
        console.error('Client ID not found in query parameters.');
        return;
    }

    const confirmAction = confirm("Are you sure you want to save and release this profile?");
    if (!confirmAction) {
        return;
    }

    const noteContent = "Profile released.";
    const timestamp = new Date().toLocaleString();
    const activeUser = sessionStorage.getItem('loggedInUser'); // Retrieve the active user

    if (!activeUser) {
        console.error("No active user found in sessionStorage.");
        return;
    }

    try {

        await setCheckedOutStatus(clientId, false);

        // Save expenses data (if applicable)
        await saveExpensesData();

        // Add a note about the action
        const note = {
            text: noteContent,
            timestamp: timestamp,
            username: activeUser
        };

        const addNoteResponse = await fetch('/add-note-to-client', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ clientId, note }),
        });

        if (!addNoteResponse.ok) {
            console.warn('Failed to add note to client.');
        }

    } catch (error) {
        console.error("Error during goToExpenseView:", error);
    } finally {
        // Redirect to expenses view regardless of success or failure
        window.location.href = `expensesview.html?id=${clientId}`;
    }
}

function getQueryParam(name) {

async function toggleSidebarVisibility() {
    const clientId = getQueryParam('id');
    try {
        // Fetch client data via REST API
        const response = await fetch(`/get-client/${clientId}`);
        if (!response.ok) {
            throw new Error(`Failed to fetch client data: ${response.statusText}`);
        }
        const client = await response.json();
        console.log('Client data:', client); // Debugging
        console.log('screeningInProgress:', client?.screeningInProgress); // Debugging

        if (client && client.screeningInProgress) {
            document.getElementById('leftSidebarContainer').style.display = 'block';
            // Show all sub-containers
            const snapContainer = document.getElementById('snap-household-container');
            const liheapContainer = document.getElementById('liheap-household-container');
            const householdContainer = document.getElementById('household-members-container');
            if (snapContainer) snapContainer.style.display = '';
            if (liheapContainer) liheapContainer.style.display = '';
            if (householdContainer) householdContainer.style.display = '';
            console.log('Sidebar is now visible'); // Debugging
        } else {
            // Still show the sidebar container so the stop-screening / reopen button is visible
            document.getElementById('leftSidebarContainer').style.display = 'block';
            // Hide the individual benefit containers
            const snapContainer = document.getElementById('snap-household-container');
            const liheapContainer = document.getElementById('liheap-household-container');
            const householdContainer = document.getElementById('household-members-container');
            if (snapContainer) snapContainer.style.display = 'none';
            if (liheapContainer) liheapContainer.style.display = 'none';
            if (householdContainer) householdContainer.style.display = 'none';
            console.log('Sidebar visible with only stop-screening container'); // Debugging
        }
    } catch (error) {
        console.error('Error toggling sidebar visibility:', error);
    }
}

async function setCheckedOutStatus(clientId, status) {
    try {
        const response = await fetch('/update-client', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ 
                clientId, 
                clientData: { 
                    checkedOut: [
                        {
                            status: status, // Set status to false
                            timestamp: status ? new Date().toISOString() : null, // Clear timestamp if status is false
                            user: status ? sessionStorage.getItem('loggedInUser')?.trim() || 'Unknown User' : null // Clear user if status is false
                        }
                    ] 
                } 
            }),
        });

        const result = await response.json();
        if (!response.ok || !result.success) {
            console.error(`Failed to update checkedOut status to ${status}:`, result.message);
        } else {
            console.log(`Successfully updated checkedOut status to ${status}.`);
        }
    } catch (error) {
        console.error(`Error updating checkedOut status to ${status}:`, error);
    }
}


    // Call the function after the page loads
    window.onload = function () {
        toggleSidebarVisibility();
