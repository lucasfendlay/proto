<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimations</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="notes.css">
    <style>
        .btn-close-snap-screening {
    background-color: #dc3545;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
}

.btn-close-snap-screening:hover {
    background-color: #a71d2a;
}

.btn-reopen-snap {
    background-color: #5cb85c;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
}

.btn-reopen-snap:hover {
    background-color: #449d44;
}

.btn-close-liheap-screening {
    background-color: #dc3545;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
}

.btn-close-liheap-screening:hover {
    background-color: #a71d2a;
}

.btn-close-individual-screening {
    background-color: #dc3545;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    margin-top: 6px;
    margin-bottom: 4px;
    transition: background-color 0.3s;
}

.btn-close-individual-screening:hover {
    background-color: #a71d2a;
}

.btn-reopen-individual-screening {
    background-color: #5cb85c;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    margin-top: 6px;
    transition: background-color 0.3s;
}

.btn-reopen-individual-screening:hover {
    background-color: #3d8b3d;
}

.screening-closed-box {
    margin: 4px 0;
}

        details > summary {
    cursor: pointer;
}

        .separator-bar {
    border: none;
    border-top: 1px solid #ccc;
    margin: 10px 0;
}

        .custom-details summary {
    list-style: none;
    cursor: pointer;
    font-weight: bold;
}

.custom-details summary::-webkit-details-marker {
    display: none;
}

.custom-details summary::marker {
    display: none;
}

.snap-household-box {
    border: 1px solid #ccc;
    padding: 15px;
    margin-top: 10px;
    margin-bottom: 10px;
    border-radius: 5px;
    background-color: #f9f9f9;
    width: 300px;
    box-sizing: border-box;
}
.snap-household-box h3 {
    margin-top: 0;
    color: #333;
}

#snap-household-container,
#liheap-household-container {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    max-width: 975px;
    margin-left: auto;
    margin-right: auto;
}
    </style>
</head>
<body>
    <h1>Estimated Eligibilities</h1>

    <div id="snap-household-container"></div>

    <div id="liheap-household-container"></div>

    <div id="household-members-container" class="household-member-container"></div>
    
<div id="member-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <span id="close-member-modal" class="close">&times;</span>
        <h2 id="member-modal-title"></h2>
        <div id="member-modal-content"></div>
    </div>
</div>
    
<script src="eligibility-utils.js"></script>
<script src="estimationsstep.js"></script>
<script src="estimations.js"></script>
    <script src="notes.js"></script>
    <script src="editnavigation.js"></script>

</body>
</html>
