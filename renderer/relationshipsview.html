<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Client Relationships</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="householdedit.css">
    <link rel="stylesheet" href="notes.css">
    <script src="userInfo.js"></script>
    <style>
        body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            margin-top: 60px;
        }
        .narrow-body {
            margin-left: 385px;
            margin-right: 10px;
            max-width: calc(100% - 395px);
            margin: 0 auto;
            margin-top: 60px;
        }
        .household-member-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            align-items: center;
            text-align: center;
        }
        .household-member {
            display: flex;
            flex-direction: column;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            width: 80%;
            align-items: center;
            text-align: center;
            margin: 0 auto;
        }
        .relationship-entry {
            text-align: center;
            margin: 10px 0;
        }
        .relationship-label {
            display: inline-block;
            padding: 5px 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            margin-top: 5px;
        }
        .read-only {
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
    <script src="viewnavigation.js"></script>
</head>
<body class="narrow-body">

    <h1>Relationships</h1>

    <div id="notes-container">
        <textarea id="note-input" placeholder="Add Note..."></textarea>
        <button id="save-note">Save Note</button>
        <div id="notes-list"></div>
    </div>

    <div id="householdMemberContainer" class="household-member-container"></div>

    <script src="notes.js"></script>
    <script src="relationshipsview.js"></script>
</body>
</html>
