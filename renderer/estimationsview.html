    <style>

        /* SNAP Flip Card Styles */
        .snap-flip-card {
    perspective: 1000px;
}

.snap-flip-card-inner {
    position: relative;
    width: 100%;
    transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1), height 0.4s ease;
    transform-style: preserve-3d;
    overflow: visible;
}

.snap-flip-card-front,
.snap-flip-card-back {
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.snap-flip-card-front {
    position: relative;
    z-index: 2;
}

.snap-flip-card-back {
    transform: rotateY(180deg);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1;
}

.snap-flip-hint {
    user-select: none;
    opacity: 0.6;
    transition: opacity 0.3s;
}

.snap-flip-card:hover .snap-flip-hint {
    opacity: 1;
}

        #save-continue {
            display: none; /* Default to block, will be toggled by JS */
        }

#save-exit, #save-continue {
            border: 1px solid #000000;
            border-radius: 5px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s, color 0.3s;
        }
    
        #save-exit:hover, #save-continue:hover {
            background-color: #0056b3;
            color: white;
        }

        details > summary {
            cursor: pointer;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            margin-top: 60px;
        }
        
        #app {
            max-width: 800px;

        }
        
        #household-row {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        #snap-household-container {

        #liheap-household-container {

            background: #f9f9f9;

        }
        
        #household-members-container {

            justify-content: center;

        .household-member-box {

<script>

function getQueryParameter(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
}

async function redirectToEstimationsView() {
    const clientId = getQueryParameter('id');
    if (!clientId) {
        console.error('Client ID not found in query parameters.');
        return;
    }

    const confirmAction = confirm("Are you sure you want to save and release this profile?");
    if (!confirmAction) return;

    const noteContent = "Profile released.";
    const timestamp = new Date().toLocaleString();
    const activeUser = sessionStorage.getItem('loggedInUser');

    if (!activeUser) {
        console.error("No active user found in sessionStorage.");
        return;
    }

    try {
        await setCheckedOutStatus(clientId, false);
        console.log("Saving profile and redirecting...");

        const note = {
            text: noteContent,
            timestamp: timestamp,
            username: activeUser
        };

        const addNoteResponse = await fetch(`/add-note-to-client`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ clientId, note })
        });

        if (!addNoteResponse.ok) {
            console.warn('Failed to add note to client.');
        }
    } catch (error) {
        console.error("Error during redirectToEstimationsView:", error);
    } finally {
        window.location.href = `estimationsview.html?id=${clientId}`;
    }
}

async function continueToApplication() {
    const clientId = getQueryParameter('id');
    if (!clientId) {
        console.error('Client ID not found in query parameters.');
        return;
    }

    const activeUser = sessionStorage.getItem('loggedInUser');
    if (!activeUser) {
        console.error("No active user found in sessionStorage.");
        return;
    }

    const confirmAction = confirm("Are you sure you want to continue to the application step?");
    if (!confirmAction) return;

    try {
        const response = await fetch(`/get-client/${clientId}`);
        if (!response.ok) {
            throw new Error(`Failed to fetch client data: ${response.statusText}`);
        }

        const clientData = await response.json();
        const members = clientData.householdMembers || [];

        const householdBenefits = new Set();
        const individualBenefitsDetails = [];

        members.forEach(member => {
            const memberBenefits = [];

            ['PACE', 'LIS', 'MSP', 'PTRR', 'SNAP', 'LIHEAP'].forEach(benefit => {
                const isHouseholdBenefit = ['SNAP', 'LIHEAP'].includes(benefit);

                let isButtonDisplayed = true;
                if (!isHouseholdBenefit) {
                    const benefitButton = document.querySelector(
                        `.benefit-apply-button[data-benefit="${benefit}"][data-member-id="${member.householdMemberId}"]`
                    );
                    isButtonDisplayed = !!benefitButton && benefitButton.style.display !== 'none';
                }

                if (!isHouseholdBenefit && !isButtonDisplayed) {
                    if (member[benefit]?.application) {
                        member[benefit].application.forEach(app => app.applying = false);
                    }
                }

                if (member[benefit]?.application?.some(app => app.applying === true)) {
                    if (isHouseholdBenefit) {
                        householdBenefits.add(benefit);
                    } else {
                        memberBenefits.push(benefit);
                    }
                }
            });

            if (memberBenefits.length > 0) {
                individualBenefitsDetails.push(
                    `<strong>${member.firstName.toUpperCase()} ${member.lastName.toUpperCase()}</strong><br><br>${memberBenefits.join('<br>')}`
                );
            }
        });

        const householdBenefitsText = Array.from(householdBenefits).join('<br>');
        const individualBenefitsText = individualBenefitsDetails.join('<br><br>');

        let noteContent = '';
        if (householdBenefits.size > 0) {
            noteContent = `<strong>Applying</strong><br><br>${householdBenefitsText}<br><br>${individualBenefitsText}`.trim();
        } else {
            noteContent = `<strong>Applying</strong><br><br>${individualBenefitsText}`.trim();
        }

        const timestamp = new Date().toLocaleString();
        const note = {
            text: noteContent,
            timestamp: timestamp,
            username: activeUser
        };

        const addNoteResponse = await fetch(`/add-note-to-client`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ clientId, note })
        });

        if (!addNoteResponse.ok) {
            console.warn('Failed to add note to client.');
        }

        console.log("Note added:", noteContent);
    } catch (error) {
        console.error("Error during continueToApplication:", error);
    } finally {
        window.location.href = `applicationedit.html?id=${clientId}`;
    }
}

// Load screening buttons on page load
window.addEventListener('DOMContentLoaded', () => {
});

</script>
<script>
    let _eqDebounceTimer = null;

    function equalizeBoxHeights() {
        // Only equalize individual member boxes inside #household-members-container
        const container = document.getElementById('household-members-container');
        if (!container) return;
        const boxes = container.querySelectorAll(':scope > .household-member-box');
        if (boxes.length === 0) return;

        // Reset heights first
        boxes.forEach(box => box.style.minHeight = '');

        // Find the tallest
        let maxHeight = 0;
        boxes.forEach(box => {
            const height = box.getBoundingClientRect().height;
            if (height > maxHeight) maxHeight = height;
        });

        // Apply to all
        boxes.forEach(box => {
            box.style.minHeight = `${maxHeight}px`;
        });
    }

    // Debounced version to avoid rapid-fire calls
    function debouncedEqualizeBoxHeights() {
        if (_eqDebounceTimer) cancelAnimationFrame(_eqDebounceTimer);
        _eqDebounceTimer = requestAnimationFrame(equalizeBoxHeights);
    }

    // Run after content loads and re-run on any dynamic changes
    const _eqObserver = new MutationObserver(debouncedEqualizeBoxHeights);

    window.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('household-members-container');
        if (container) {
            _eqObserver.observe(container, { childList: true, subtree: true, characterData: true });
        }
        // Initial equalization after a short delay to let JS render
        setTimeout(equalizeBoxHeights, 500);
    });

    window.addEventListener('resize', equalizeBoxHeights);
</script>
<script>
    // Equalize SNAP and LIHEAP box heights
    let _snapLiheapDebounceTimer = null;

    function equalizeSnapLiheapHeights() {
        const snapBox = document.getElementById('snap-household-container');
        const liheapBox = document.getElementById('liheap-household-container');
        if (!snapBox || !liheapBox) return;

        // Reset heights first
        snapBox.style.minHeight = '';
        liheapBox.style.minHeight = '';

        // Match LIHEAP to SNAP height
        const snapHeight = snapBox.getBoundingClientRect().height;
        const liheapHeight = liheapBox.getBoundingClientRect().height;
        const maxHeight = Math.max(snapHeight, liheapHeight);

        snapBox.style.minHeight = `${maxHeight}px`;
        liheapBox.style.minHeight = `${maxHeight}px`;
    }

    function debouncedEqualizeSnapLiheapHeights() {
        if (_snapLiheapDebounceTimer) cancelAnimationFrame(_snapLiheapDebounceTimer);
        _snapLiheapDebounceTimer = requestAnimationFrame(equalizeSnapLiheapHeights);
    }

    const _snapLiheapObserver = new MutationObserver(debouncedEqualizeSnapLiheapHeights);

    window.addEventListener('DOMContentLoaded', () => {
        const snapBox = document.getElementById('snap-household-container');
        const liheapBox = document.getElementById('liheap-household-container');
        if (snapBox) _snapLiheapObserver.observe(snapBox, { childList: true, subtree: true, characterData: true });
        if (liheapBox) _snapLiheapObserver.observe(liheapBox, { childList: true, subtree: true, characterData: true });
        setTimeout(equalizeSnapLiheapHeights, 500);

        // Listen for details toggle events inside both containers
        function attachDetailsToggleListeners() {
            const snapBox = document.getElementById('snap-household-container');
            const liheapBox = document.getElementById('liheap-household-container');
            [snapBox, liheapBox].forEach(container => {
                if (!container) return;
                container.querySelectorAll('details').forEach(details => {
                    details.removeEventListener('toggle', debouncedEqualizeSnapLiheapHeights);
                    details.addEventListener('toggle', debouncedEqualizeSnapLiheapHeights);
                });
            });
        }

        // Attach initially and re-attach whenever content changes
        attachDetailsToggleListeners();
        const _detailsObserver = new MutationObserver(() => {
            attachDetailsToggleListeners();
            debouncedEqualizeSnapLiheapHeights();
        });
        if (snapBox) _detailsObserver.observe(snapBox, { childList: true, subtree: true });
        if (liheapBox) _detailsObserver.observe(liheapBox, { childList: true, subtree: true });
    });

    window.addEventListener('resize', equalizeSnapLiheapHeights);
</script>
