<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Client Relationships</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="householdedit.css">
    <link rel="stylesheet" href="notes.css">
    <script src="userInfo.js"></script>
    <style>
        details > summary {
            cursor: pointer;
        }
        .narrow-body {
            margin-left: 385px;
            margin-right: 10px;
            max-width: calc(100% - 395px);
            margin: 0 auto;
            margin-top: 60px;
        }
        .household-member-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .household-member {
            display: flex;
            flex-direction: column;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            width: 80%;
            align-items: center;
            text-align: center;
            margin: 0 auto;
        }
        .selection-box {
            margin-top: 10px;
            text-align: center;
        }
        .selection-option {
            display: inline-block;
            padding: 5px 10px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }
        .selection-option.selected {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        .action-buttons {
            text-align: center;
            margin-top: 20px;
        }
        .relationship-entry,
        .spouse-dropdown-container {
            text-align: center;
        }
    </style>
    <script src="editnavigation.js"></script>
</head>
<body class="narrow-body">

    <h1>Relationships</h1>

    <div class="left-sidebar-container" id="leftSidebarContainer" style="display: none;">
        <div id="snap-household-container" class="left-sidebar"></div>
        <div id="liheap-household-container" class="left-sidebar"></div>
        <div id="household-members-container" class="left-sidebar"></div>
    </div>

    <div id="notes-container">
        <textarea id="note-input" placeholder="Add Note..."></textarea>
        <button id="save-note">Save Note</button>
        <div id="notes-list"></div>
    </div>

    <div id="householdMemberContainer" class="household-member-container"></div>

    <div id="actionButtons" class="action-buttons" style="display: none;">
        <button id="save-exit">Save and Release Profile</button>
        <button id="save-continue">Save and Continue</button>
    </div>
    <script src="eligibility-utils.js"></script>
    <script src="estimations.js"></script>
    <script src="notes.js"></script>
    <script src="relationships.js"></script>
</body>
</html>
